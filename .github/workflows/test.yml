name: Test
# THIS IS FOR TESTING THE ACTION: DO NOT USE IT IN YOUR DRUPAL PROJECT, USE
# workflow-templates/update-config-branch.yml instead.
#
# Secrets
# - TEST_CONFIG_REPO_TOKEN: A token with write access to the contents of the
#   config repo.
# - TEST_SITE_REPO_TOKEN: A token with write access to the contents and PRs of
#   the test site repo.
# Variables
# - TEST_CONFIG_REPO: The GitHub config repo for use with the test.
# - TEST_SITE_REPO: The GitHub site repo for use with the test.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-initial-setup:
    name: Test mirroring the config repo to the site repo (ie initial setup)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_live_branch: "${{ github.job }}-main"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert the state after running the action
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          # Assert the state after running the action
          set -eu
          git checkout ${{ env.test_site_repo_pr_branch_base }}
          if [[ "$(gh pr list --json id)" != "[]" ]]; then
            echo "**TEST FAILURE:** There shouldn't be a PR after running the action the first time to create the config-only branch." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"

  test-initial-setup-creates-pr:
    name: Test that initial setup opens a PR when prod config diverges from live.
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-job
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_live_branch: "${{ github.job }}-main"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - name: 'Test setup: diverge prod config from live before the mirror branch exists'
        working-directory: test
        run: |
          # Diverge prod config from the live branch, leaving the mirror branch absent.
          set -eu
          cd remote
          echo firstrun > c
          git add c
          git commit -m "Prod config change before mirror branch exists"
          git push origin HEAD:${{ env.test_config_repo_branch }}

          # Leave an obsolete config subdirectory in live to prove subdir removal.
          cd ../site
          git checkout ${{ env.test_site_repo_live_branch }}
          mkdir -p config/sync/obsolete_collection
          echo stale > config/sync/obsolete_collection/legacy.yml
          git add config/sync
          git commit -m "Leave an obsolete config subdirectory in live"
          git push origin HEAD

      - uses: ./test/update-config
        id: run_action
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert a PR was created carrying the prod config
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          # Assert a PR was created carrying the prod config
          set -eu
          exit=0

          if [[ "$(gh pr list --head ${{ env.test_site_repo_pr_branch }} --json id)" == "[]" ]]; then
            echo "**TEST FAILURE:** A PR should be created on initial setup when prod config diverges from live." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          git fetch origin ${{ env.test_site_repo_pr_branch }}
          git checkout origin/${{ env.test_site_repo_pr_branch }} -- config/sync
          if [[ "$(cat config/sync/c)" != "firstrun" ]]; then
            echo "**TEST FAILURE:** The PR branch should carry the prod config (config/sync/c should be 'firstrun')." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          ref=origin/${{ env.test_site_repo_pr_branch }}
          tree=$(git ls-tree -r --name-only "$ref" -- config/sync)
          if [[ "$(git show "$ref:config/sync/language/en/system.site.yml")" != "subdir-config" ]]; then
            echo "**TEST FAILURE:** config/sync/language/en/system.site.yml should be 'subdir-config' (config subdirectory not copied)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi
          if [[ "$(git show "$ref:config/sync/.htaccess")" != "dotfile-config" ]]; then
            echo "**TEST FAILURE:** config/sync/.htaccess should be 'dotfile-config' (dotfile not copied)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi
          if grep -q '^config/sync/obsolete_collection/' <<<"$tree"; then
            echo "**TEST FAILURE:** config/sync/obsolete_collection/ should have been removed (stale subdirectory not deleted)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi
          if grep -q '^config/sync/\.git/' <<<"$tree"; then
            echo "**TEST FAILURE:** config/sync/.git/ should not be present (remote .git was copied)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          exit $exit

      - name: Assert the summary names the PR branch, not the config branch
        env:
          SUMMARY: ${{ steps.run_action.outputs.summary }}
        run: |
          set -eu
          printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_pr_branch }}" || {
            echo "**TEST FAILURE:** Summary should name the PR branch (\`${{ env.test_site_repo_pr_branch }}\`), was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_config_branch }}"; then
            echo "**TEST FAILURE:** Summary should not name the config-only branch as the commit target, was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"

  test-create-pr:
    name: Test updating the mirrored config branch and creating a PR from it.
    runs-on: ubuntu-latest
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
      test_site_repo_live_branch: "${{ github.job }}-main"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - name: 'Test setup for testing creating a PR'
        working-directory: test
        run: |
          set -eu
          cd site
          git remote add remote-config ../remote
          git fetch remote-config
          # Create the site repo config-only branch 1 commit behind the config repo.
          git checkout -b ${{ env.test_site_repo_config_branch }} remote-config/${{ env.test_config_repo_branch }}^
          tmp_dir=$(mktemp -d)
          cp * "$tmp_dir"
          git push origin HEAD
          
          # Ensure the live branch matches the new site repo config branch.
          git checkout ${{ env.test_site_repo_live_branch }}
          find config/sync -mindepth 1 -delete
          mv "$tmp_dir"/* config/sync
          echo baseline > config/sync/e
          git add config/sync
          git commit --amend -m "Update"
          git push --force origin HEAD
          
          # Update the staging branch with a fresh config change.
          git checkout ${{ env.test_site_repo_pr_branch_base }}
          git reset --hard ${{ env.test_site_repo_live_branch }}
          echo modified > config/sync/e
          git add config/sync/e
          git commit -m "Simulate updating config during development"
          git push --force

      - uses: ./test/update-config
        id: run_action
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert the state after running the action
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          set -eu
          exit=0

          if [[ "$(gh pr list --head ${{ env.test_site_repo_pr_branch }} --json id)" == "[]" ]]; then
            echo "**TEST FAILURE:** There should be a PR created." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          git checkout ${{ env.test_site_repo_pr_branch_base }}
          if ! git merge --no-edit origin/${{ env.test_site_repo_pr_branch }}; then
            echo "**TEST FAILURE:** Merging the config PR into \`${{ env.test_site_repo_pr_branch_base }}\` produced a conflict." >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            exit 1
          fi
          if [[ "$(cat config/sync/c)" != "modified" ]]; then
            echo "**TEST FAILURE:** After merging the config PR the 'c' file is incorrect." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ "$(cat config/sync/e)" != "modified" ]]; then
            echo "**TEST FAILURE:** After merging the config PR the 'e' file is incorrect." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ ! -f config/sync/language/en/system.site.yml ]]; then
            echo "**TEST FAILURE:** config/sync/language/en/system.site.yml should be present after merging the config PR (config subdirectory lost)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ ! -f config/sync/.htaccess ]]; then
            echo "**TEST FAILURE:** config/sync/.htaccess should be present after merging the config PR (dotfile lost)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          exit $exit

      - name: Assert the summary names the PR branch, not the config branch
        env:
          SUMMARY: ${{ steps.run_action.outputs.summary }}
        run: |
          set -eu
          printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_pr_branch }}" || {
            echo "**TEST FAILURE:** Summary should name the PR branch (\`${{ env.test_site_repo_pr_branch }}\`), was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_config_branch }}"; then
            echo "**TEST FAILURE:** Summary should not name the config-only branch as the commit target, was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"

  test-stale-closed-pr:
    name: Test that a leftover branch from a closed/rejected PR is reset, not stacked onto.
    runs-on: ubuntu-latest
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
      test_site_repo_live_branch: "${{ github.job }}-main"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - name: 'Test setup: mirror behind, align live, and leave a stale closed PR branch'
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test
        run: |
          set -eu
          cd site
          git remote add remote-config ../remote
          git fetch remote-config
          # Create the site repo config-only branch 1 commit behind the config repo.
          git checkout -b ${{ env.test_site_repo_config_branch }} remote-config/${{ env.test_config_repo_branch }}^
          tmp_dir=$(mktemp -d)
          cp * "$tmp_dir"
          git push origin HEAD

          # Ensure the live branch matches the new site repo config branch.
          git checkout ${{ env.test_site_repo_live_branch }}
          find config/sync -mindepth 1 -delete
          mv "$tmp_dir"/* config/sync
          echo baseline > config/sync/e
          git add config/sync
          # A plain commit (not --amend): the live branch tip is the orphan root
          # commit that staging also descends from. Amending it would create a
          # new root with no history in common with staging, breaking `gh pr
          # create` below (unlike the job above, this test never resets staging
          # onto live).
          git commit -m "Update"
          git push --force origin HEAD

          # Leave behind a stale rejected PR branch from a previously closed PR.
          git checkout -b ${{ env.test_site_repo_pr_branch }} ${{ env.test_site_repo_live_branch }}
          echo rejected > config/sync/rejected
          git add config/sync
          git commit -m "Rejected config change from a previous PR"
          git push origin HEAD
          gh pr create \
            --base ${{ env.test_site_repo_pr_branch_base }} \
            --head ${{ env.test_site_repo_pr_branch }} \
            --title "Old rejected PR" \
            --body "Simulated previously rejected config PR."
          # Closes without --delete-branch, so origin/PR_BRANCH remains.
          gh pr close ${{ env.test_site_repo_pr_branch }}

      - uses: ./test/update-config
        id: run_action
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert the stale rejected history is discarded and a single fresh PR exists
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          set -eu
          exit=0

          pr_count=$(gh pr list --head ${{ env.test_site_repo_pr_branch }} --base ${{ env.test_site_repo_pr_branch_base }} --state open --json id --jq 'length')
          if [[ "$pr_count" != "1" ]]; then
            echo "**TEST FAILURE:** Expected exactly 1 open PR for the PR branch, found $pr_count." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          git fetch origin ${{ env.test_site_repo_live_branch }} ${{ env.test_site_repo_pr_branch }}

          # The PR branch must be exactly one commit ahead of live: the rejected
          # commit from the closed PR must not survive. (This is the assertion the
          # buggy code fails.)
          count=$(git rev-list --count origin/${{ env.test_site_repo_live_branch }}..origin/${{ env.test_site_repo_pr_branch }})
          if [[ "$count" != "1" ]]; then
            echo "**TEST FAILURE:** The PR branch should be exactly 1 commit ahead of live, was $count (stale rejected history leaked in)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if git log origin/${{ env.test_site_repo_pr_branch }} --format='%s' | grep -q "Rejected config change"; then
            echo "**TEST FAILURE:** The rejected commit from the closed PR reappeared in the new PR history." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          # Sanity: the resurfaced file is gone and the current prod config is present.
          git checkout origin/${{ env.test_site_repo_pr_branch }} -- config/sync
          if [[ -f config/sync/rejected ]]; then
            echo "**TEST FAILURE:** config/sync/rejected should not be present in the new PR branch." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi
          if [[ "$(cat config/sync/c)" != "modified" ]]; then
            echo "**TEST FAILURE:** config/sync/c should carry the prod value 'modified'." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          exit $exit

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"

  test-existing-pr:
    name: Test updating an existing PR.
    runs-on: ubuntu-latest
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_live_branch: "${{ github.job }}-main"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - name: 'Test setup for testing updating an existing PR'
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test
        run: |
          set -eu
          cd site
          # Ensure the site repo config branch is behind the config repo.
          git remote add remote-config ../remote
          git fetch remote-config
          git checkout -b ${{ env.test_site_repo_config_branch }} remote-config/${{ env.test_config_repo_branch }}^
          tmp_dir=$(mktemp -d)
          cp * "$tmp_dir"
          git push origin HEAD
          
          # Set up an existing PR.
          git checkout ${{ env.test_site_repo_pr_branch_base }}
          find config/sync -mindepth 1 -delete
          touch config/sync/test-existing-pr
          git add config/sync
          git commit --amend -m "Initial commmit"
          git push origin HEAD --force
          
          git checkout -b ${{ env.test_site_repo_pr_branch }}
          cp -r "$tmp_dir"/* config/sync
          git add config/sync
          git commit -m "Update"
          git push origin HEAD
          
          gh pr create --base ${{ env.test_site_repo_pr_branch_base }} --title "Test PR" --body "Test PR"
          
          rm -rf "$tmp_dir"

      - uses: ./test/update-config
        id: run_action
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert the state after running the action
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          # Assert the existing PR was updated and not duplicated
          set -eu
          exit=0

          git checkout origin/${{ env.test_site_repo_pr_branch }} -- config/sync

          if [[ "$(cat config/sync/c)" != "modified" ]]; then
            echo "**TEST FAILURE:** config/sync/c should be 'modified' (new config from HEAD)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ ! -f config/sync/e ]]; then
            echo "**TEST FAILURE:** config/sync/e should be present (from config repo HEAD)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ -f config/sync/test-existing-pr ]]; then
            echo "**TEST FAILURE:** config/sync/test-existing-pr should be gone (stale pre-action file)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ -f config/sync/d ]]; then
            echo "**TEST FAILURE:** config/sync/d should be gone (stale pre-action file)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          git fetch origin ${{ env.test_site_repo_pr_branch }}
          if [[ "$(git show "origin/${{ env.test_site_repo_pr_branch }}:config/sync/language/en/system.site.yml")" != "subdir-config" ]]; then
            echo "**TEST FAILURE:** config/sync/language/en/system.site.yml should be 'subdir-config' (config subdirectory not copied on update)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi
          if [[ "$(git show "origin/${{ env.test_site_repo_pr_branch }}:config/sync/.htaccess")" != "dotfile-config" ]]; then
            echo "**TEST FAILURE:** config/sync/.htaccess should be 'dotfile-config' (dotfile not copied on update)." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          pr_count=$(gh pr list --head ${{ env.test_site_repo_pr_branch }} --json id --jq 'length')
          if [[ "$pr_count" != "1" ]]; then
            echo "**TEST FAILURE:** Expected exactly 1 open PR, found $pr_count." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          exit $exit

      - name: Assert the summary names the PR branch, not the config branch
        env:
          SUMMARY: ${{ steps.run_action.outputs.summary }}
        run: |
          set -eu
          printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_pr_branch }}" || {
            echo "**TEST FAILURE:** Summary should name the PR branch (\`${{ env.test_site_repo_pr_branch }}\`), was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_config_branch }}"; then
            echo "**TEST FAILURE:** Summary should not name the config-only branch as the commit target, was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"

  test-already-in-sync:
    name: Test the steady-state no-op (mirror already at config HEAD, so do nothing).
    runs-on: ubuntu-latest
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
      test_site_repo_live_branch: "${{ github.job }}-main"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - name: 'Test setup: create mirror branch at config HEAD (not behind)'
        working-directory: test/site
        run: |
          set -eu
          git remote add remote-config ../remote
          git fetch remote-config
          git checkout -b ${{ env.test_site_repo_config_branch }} remote-config/${{ env.test_config_repo_branch }}
          git push origin HEAD

      - uses: ./test/update-config
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert no PR was created and PR branch was never pushed
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          set -eu
          exit=0

          if [[ "$(gh pr list --head ${{ env.test_site_repo_pr_branch }} --json id)" != "[]" ]]; then
            echo "**TEST FAILURE:** No PR should have been created on the early-out path." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if git ls-remote --heads origin "${{ env.test_site_repo_pr_branch }}" | grep -q .; then
            echo "**TEST FAILURE:** The PR branch should never have been pushed on the early-out path." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          exit $exit

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"

  test-identical-config:
    name: Test updating the mirrored config branch only to find it matches what's already in staging.
    runs-on: ubuntu-latest
    env:
      test_config_repo_branch: "${{ github.job }}-main"
      test_site_repo_config_branch: "${{ github.job }}-config-only"
      test_site_repo_pr_branch: "${{ github.job }}-automatic-config-export"
      test_site_repo_pr_branch_base: "${{ github.job }}-staging"
      test_site_repo_live_branch: "${{ github.job }}-main"
    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: test/update-config

      - uses: ./test/update-config/.github/actions/test-setup
        with:
          branch_prefix: "${{ github.job }}-"
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          test_site_repo_live_branch: "${{ github.job }}-main"
          test_site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          test_site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - name: 'Test setup for testing matching config'
        working-directory: test/site
        run: |
          set -eu
          git remote add remote-config ../remote
          git fetch remote-config
          git checkout -b ${{ env.test_site_repo_config_branch }} remote-config/${{ env.test_config_repo_branch }}^
          git push origin HEAD

      - uses: ./test/update-config
        id: run_action
        with:
          config_repo: ${{ vars.TEST_CONFIG_REPO }}
          config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          config_repo_branch: ${{ env.test_config_repo_branch }}
          site_repo: ${{ vars.TEST_SITE_REPO }}
          site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          site_repo_config_branch: ${{ env.test_site_repo_config_branch }}
          site_repo_live_branch: ${{ env.test_site_repo_live_branch }}
          site_repo_pr_branch: ${{ env.test_site_repo_pr_branch }}
          site_repo_pr_branch_base: ${{ env.test_site_repo_pr_branch_base }}

      - uses: ./test/update-config/.github/actions/test-assertions
        with:
          test_config_repo: ${{ vars.TEST_CONFIG_REPO }}
          test_config_repo_branch: ${{ env.test_config_repo_branch }}
          test_config_repo_token: ${{ secrets.TEST_CONFIG_REPO_TOKEN }}
          test_site_repo: ${{ vars.TEST_SITE_REPO }}
          test_site_repo_token: ${{ secrets.TEST_SITE_REPO_TOKEN }}
          test_site_repo_config_branch: ${{ env.test_site_repo_config_branch }}

      - name: Assert the state after running the action
        env:
          GH_TOKEN: ${{ secrets.TEST_SITE_REPO_TOKEN }}
        working-directory: test/site
        run: |
          set -eu
          exit=0
          
          if [[ "$(gh pr list --head ${{ env.test_site_repo_pr_branch }} --json id)" != "[]" ]]; then
            echo "**TEST FAILURE:** There should not be a PR created." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi
          
          git checkout ${{ env.test_site_repo_pr_branch_base }}

          if [[ "$(cat config/sync/c)" != "modified" ]]; then
            echo "**TEST FAILURE:** The PR base branch doesn't contain the updated file 'c'." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          if [[ "$(cat config/sync/e)" != "modified" ]]; then
            echo "**TEST FAILURE:** The PR base branch doesn't contain the updated file 'e'." >> "$GITHUB_STEP_SUMMARY"
            exit=1
          fi

          exit $exit

      - name: Assert the no-op summary names the live branch, not the base branch
        env:
          SUMMARY: ${{ steps.run_action.outputs.summary }}
        run: |
          set -eu
          printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_live_branch }}" || {
            echo "**TEST FAILURE:** No-op summary should name the live branch (\`${{ env.test_site_repo_live_branch }}\`), was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if printf '%s' "$SUMMARY" | grep -qF "${{ env.test_site_repo_pr_branch_base }}"; then
            echo "**TEST FAILURE:** No-op summary should not name the PR base branch, was: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi

      - uses: ./test/update-config/.github/actions/test-teardown
        if: ${{ always() }}
        with:
          branch_prefix: "${{ github.job }}-"
